
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的工具箱</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f3f5f8;
  color: #263445;
  font-family: "Microsoft YaHei", sans-serif;
}
header {
  background: #263d59;
  color: white;
  padding: 35px 20px;
  text-align: center;
}
header h1 { margin: 0 0 10px; }
main {
  max-width: 900px;
  margin: 35px auto;
  padding: 0 18px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 18px;
}
.item {
  background: white;
  border-radius: 12px;
  padding: 25px;
  box-shadow: 0 2px 10px #0000000c;
}
.item h3 { margin-top: 0; }
.item p { color: #718096; font-size: 14px; }
footer {
  text-align: center;
  color: #999;
  padding: 30px;
}
</style>
</head>
<body>
<header>
  <h1>我的工具箱</h1>
  <p>简单、实用、方便的在线工具</p>
</header>
<main>
  <div class="grid">
    <div class="item">
      <h3>图片处理</h3>
      <p>图片转换、压缩和优化</p>
    </div>
    <div class="item">
      <h3>截图识字</h3>
      <p>在线图片文字识别</p>
    </div>
    <div class="item">
      <h3>文件工具</h3>
      <p>文件转换和下载</p>
    </div>
    <div class="item">
      <h3>视频播放</h3>
      <p>在线视频播放</p>
    </div>
  </div>
</main>
<footer>© 2026 我的工具箱</footer>
</body>
</html>
